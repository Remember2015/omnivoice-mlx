[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivoice-mlx"
version = "0.1.0"
description = "OmniVoice (k2-fsa) on Apple silicon with MLX — torch-free inference, quantised, RTF 0.12"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES.md"]
authors = [{ name = "Luke (子龙)", email = "developer@ohmyai.app" }]
keywords = ["tts", "mlx", "apple-silicon", "omnivoice", "speech-synthesis", "diffusion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "mlx>=0.32",
  "numpy",
  "safetensors",
  "soundfile",
  "tokenizers",
]

[project.optional-dependencies]
# bench/ only: the mlx-audio baseline (bench_mlxaudio.py) and weight downloads.
bench = ["huggingface_hub", "mlx-audio>=0.5", "scipy"]
# omnivoice_mlx.textnorm / ttstext: the rewriting layer, imported lazily.
textnorm = ["markdown-it-py", "wetext"]

[project.urls]
Homepage = "https://github.com/Remember2015/omnivoice-mlx"
Upstream = "https://github.com/k2-fsa/OmniVoice"

[tool.hatch.build.targets.wheel]
packages = ["omnivoice_mlx"]

[tool.hatch.build.targets.sdist]
include = ["omnivoice_mlx", "bench", "scripts", "README.md", "LICENSE", "NOTICE", "THIRD-PARTY-LICENSES.md"]

[tool.ruff]
line-length = 120
